<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thai Water Watch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root {
  --bg: #f3f6f7;
  --panel: #ffffff;
  --ink: #14242b;
  --muted: #5b6d74;
  --line: #dbe3e6;
  --accent: #0b6e8a;
  --accent-soft: #e2f0f4;
  /* ThaiWater official situation colours */
  --l1: #db802b; --l2: #e0a800; --l3: #00a14b; --l4: #1f4fe0; --l5: #e02020; --l0: #9aa7ac;
  --font: "IBM Plex Sans Thai", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e171b; --panel: #152228; --ink: #e3edf0; --muted: #93a6ad;
    --line: #243740; --accent: #4cc2e0; --accent-soft: #173640;
    --l4: #5b86ff; --l5: #ff4d4d; --l0: #62737a;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font); display: grid; grid-template-columns: 360px 1fr; }
button, select, input { font: inherit; color: inherit; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

aside { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; overflow-y: auto; }
.head { padding: 18px 18px 14px; border-bottom: 1px solid var(--line); display: grid; gap: 4px; }
.head-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
h1 { font-size: 20px; line-height: 1.2; margin: 0; font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; }
h1 span { color: var(--accent); }
.sub { color: var(--muted); font-size: 12.5px; margin: 0; }
.updated { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 5px 10px; cursor: pointer; font-size: 12.5px; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.on { background: var(--accent); border-color: var(--accent); color: var(--panel); }

section { padding: 14px 18px; border-bottom: 1px solid var(--line); display: grid; gap: 10px; }
h2 { margin: 0; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }

.alert { border-radius: 10px; padding: 12px 14px; background: var(--accent-soft); display: grid; gap: 2px; }
.alert strong { font-size: 15px; }
.alert.bad { background: color-mix(in srgb, var(--l5) 14%, var(--panel)); }
.alert.warn { background: color-mix(in srgb, var(--l4) 14%, var(--panel)); }
.alert.ok { background: color-mix(in srgb, var(--l3) 14%, var(--panel)); }
.alert small { color: var(--muted); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
select { width: 100%; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }

.legend { display: grid; gap: 4px; }
.legend label { display: grid; grid-template-columns: 18px 14px 1fr auto; align-items: center; gap: 8px; cursor: pointer; padding: 3px 4px; border-radius: 6px; }
.legend label:hover { background: var(--accent-soft); }
.legend input { margin: 0; accent-color: var(--accent); }
.dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
.count { font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.range { color: var(--muted); font-size: 12px; margin-left: 4px; }

.list { display: grid; gap: 2px; }
.item { display: grid; grid-template-columns: 4px 1fr auto; gap: 10px; align-items: center; padding: 7px 6px; border-radius: 8px; cursor: pointer; border: 0; background: none; text-align: left; width: 100%; }
.item:hover { background: var(--accent-soft); }
.item .bar { align-self: stretch; border-radius: 2px; }
.item .nm { font-weight: 500; line-height: 1.3; }
.item .pv { color: var(--muted); font-size: 12px; }
.item .pct { font-family: var(--mono); font-size: 13px; font-variant-numeric: tabular-nums; }
.empty { color: var(--muted); font-size: 13px; }
.note { color: var(--muted); font-size: 12px; }
.note a { color: var(--accent); }

main { position: relative; min-height: 0; }
#map { position: absolute; inset: 0; background: var(--bg); }
.tiles-dark { filter: invert(1) hue-rotate(180deg) brightness(0.9) contrast(0.9) saturate(0.6); }
.status { position: absolute; z-index: 500; left: 50%; top: 14px; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--line); padding: 8px 14px; border-radius: 999px; box-shadow: 0 4px 16px rgb(0 0 0 / 0.12); font-size: 13px; max-width: calc(100% - 32px); }
.status.err { color: var(--l5); }

.leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--panel); color: var(--ink); }
.leaflet-popup-content { margin: 14px 16px; font: 13px/1.45 var(--font); min-width: 230px; }
.pop h3 { margin: 0 0 2px; font-size: 15px; }
.pop .where { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
.pill { display: inline-block; padding: 2px 9px; border-radius: 999px; color: #fff; font-weight: 600; font-size: 12px; }
.gauge { height: 8px; border-radius: 4px; background: var(--line); margin: 10px 0 4px; position: relative; overflow: hidden; }
.gauge i { position: absolute; inset: 0 auto 0 0; border-radius: 4px; }
.gauge b { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--ink); opacity: 0.5; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin: 8px 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-family: var(--mono); font-size: 12.5px; text-align: right; font-variant-numeric: tabular-nums; }
.stale { color: var(--l1); font-size: 12px; margin: 4px 0; }
.gmaps { display: inline-block; margin-top: 4px; color: var(--accent) !important; font-weight: 600; text-decoration: none; }
.gmaps:hover { text-decoration: underline; }

/* Road flood sensors */
:root { --r0: #2f9e6e; --r1: #d9a600; --r2: #f07a1a; --r3: #e02020; --r4: #7a1fa8; --r5: #5b6fae; }
.road-ic { display: flex; align-items: center; justify-content: center; }
.road-ic span { display: inline-flex; align-items: center; justify-content: center; gap: 2px; min-width: 30px; height: 20px; padding: 0 6px; border-radius: 5px; color: #fff; font: 600 11.5px/1 var(--mono); border: 2px solid #fff; box-shadow: 0 1px 4px rgb(0 0 0 / .35); white-space: nowrap; font-variant-numeric: tabular-nums; }
.road-ic span small { font-size: 9px; opacity: .85; }
.road-ic.dry span { min-width: 0; width: 12px; height: 12px; padding: 0; border-radius: 3px; border-width: 1.5px; }
.road-ic.off span { min-width: 0; width: 11px; height: 11px; padding: 0; border-radius: 3px; border-width: 1.5px; opacity: .7; }
.far .road-ic.wet span { min-width: 0; width: 14px; height: 14px; padding: 0; font-size: 0; }
.far .road-ic.wet span small { display: none; }
.layers { display: grid; gap: 6px; }
.layers label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.layers input { margin: 0; accent-color: var(--accent); }
.layers .count { margin-left: auto; }
.sq { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.roadscale { display: grid; gap: 3px; }
.roadscale div { display: grid; grid-template-columns: 14px 64px 1fr; gap: 8px; align-items: center; font-size: 12.5px; }
.roadscale .cm { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
.depthbar { display: flex; align-items: flex-end; gap: 10px; margin: 10px 0 4px; }
.depthbar .car { font-size: 12px; color: var(--muted); }
.big { font: 700 28px/1 var(--mono); }

/* Community reports */
.road-ic.comm span { border-style: dashed; border-color: #fff; outline: 2px solid var(--accent); outline-offset: 0; }
.fab { position: absolute; z-index: 600; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--accent); color: #fff; border: 0; border-radius: 999px; padding: 12px 22px; font-weight: 700; font-size: 15px;
  box-shadow: 0 6px 20px rgb(0 0 0 / .25); cursor: pointer; white-space: nowrap; }
.fab:hover { filter: brightness(1.08); }
.sheet { position: absolute; z-index: 700; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  width: min(420px, calc(100% - 32px)); max-height: calc(100% - 32px); overflow-y: auto;
  background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; box-shadow: 0 10px 30px rgb(0 0 0 / .25); }
.sheet form, .pickbar { display: grid; gap: 10px; }
.sheet .row { display: flex; gap: 8px; flex-wrap: wrap; }
.sheet .btn { padding: 8px 14px; font-size: 14px; }
.sheet fieldset { border: 0; margin: 0; padding: 0; display: grid; gap: 6px; }
.sheet legend { font-weight: 600; margin-bottom: 6px; padding: 0; }
.depths { display: grid; gap: 6px; }
.depths label { cursor: pointer; }
.depths input { position: absolute; opacity: 0; pointer-events: none; }
.depths span { display: grid; grid-template-columns: 14px auto 1fr; gap: 8px; align-items: center; padding: 8px 10px; border: 1.5px solid var(--line); border-radius: 10px; }
.depths em { font-style: normal; color: var(--muted); font-size: 12.5px; text-align: right; }
.depths input:checked + span { border-color: var(--accent); background: var(--accent-soft); }
.depths input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.note-in { display: grid; gap: 4px; font-weight: 600; }
.note-in textarea { font: inherit; font-weight: 400; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); resize: vertical; }
.hint { margin: 0; color: var(--muted); font-size: 12.5px; }
.err { margin: 0; color: var(--l5); font-weight: 600; font-size: 13px; }
#map.picking { cursor: crosshair; }
/* while choosing a spot, taps go through existing markers to the map */
#map.picking .mk:not(.pick-ic) { pointer-events: none; }

/* River stations (same look on both maps) */
.st span { display: block; width: 100%; height: 100%; border-radius: 50%; border: 1.5px solid #fff; box-shadow: 0 0 0 1px rgb(0 0 0 / .18); box-sizing: border-box; }
.st0 span { opacity: .6; }
.st5 span { border: 2px solid #fff; animation: ring 1.8s ease-out infinite; }
@keyframes ring { 0% { box-shadow: 0 0 0 0 rgb(224 32 32 / .6); } 100% { box-shadow: 0 0 0 12px rgb(224 32 32 / 0); } }
@media (prefers-reduced-motion: reduce) { .st5 span { animation: none; } }
.me span { display: block; width: 100%; height: 100%; border-radius: 50%; background: #0b6e8a; border: 3px solid #fff; box-shadow: 0 0 0 1px rgb(0 0 0 / .3); box-sizing: border-box; }
.gmk:hover { z-index: 9999 !important; }
.map-btn { box-shadow: 0 2px 8px rgb(0 0 0 / .2); padding: 7px 12px; font-size: 13px; }
.map-ctl { position: absolute; z-index: 650; top: 10px; right: 10px; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.route-btn { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
.route-btn:hover { color: #fff; filter: brightness(1.08); }
.map-btn.tgl[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
#routeSec.flash { animation: flash 1.6s ease-out; }
@keyframes flash { 0% { background: var(--accent-soft); } 100% { background: transparent; } }
@media (prefers-reduced-motion: reduce) { #routeSec.flash { animation: none; } }
.traffic-sq { background: linear-gradient(90deg, #1e8e3e 0 33%, #f29900 33% 66%, #d93025 66%); }
.basemap { display: grid; gap: 6px; margin-top: 6px; font-size: 12.5px; color: var(--muted); }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
/* Google popups are always white, so pin their colours to the light palette */
.gpop { --panel: #fff; --ink: #14242b; --muted: #5b6d74; --line: #dbe3e6; --accent: #0b6e8a; --accent-soft: #e2f0f4; --l1: #db802b; --l5: #e02020;
  color: #14242b; font: 13px/1.45 var(--font); min-width: 230px; }
.pick-ic span { display: block; width: 26px; height: 26px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: var(--accent); border: 3px solid #fff; box-shadow: 0 2px 8px rgb(0 0 0 / .4); }
.toast { position: absolute; z-index: 800; left: 50%; top: 14px; transform: translateX(-50%); background: var(--ink); color: var(--panel); padding: 9px 16px; border-radius: 999px; font-weight: 600; max-width: calc(100% - 32px); }
.toast.bad { background: var(--l5); color: #fff; }
.votes { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 10px 0 4px; }
.votes .vq { width: 100%; font-weight: 600; }
.votes .del { color: var(--l5); }

/* Rain radar overlay */
.rv-bar { position: absolute; z-index: 640; left: 10px; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); width: min(300px, calc(100% - 20px));
  display: flex; gap: 10px; align-items: center; padding: 8px 10px; background: var(--panel); color: var(--ink);
  border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 4px 16px rgb(0 0 0 / .18); }
.rv-play { width: 36px; height: 36px; padding: 0; border-radius: 50%; font-size: 13px; flex: none; }
.rv-mid { flex: 1; display: grid; gap: 2px; min-width: 0; }
.rv-top { display: flex; justify-content: space-between; gap: 6px; font-size: 12px; }
.rv-top span { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.rv-mid input { width: 100%; accent-color: var(--accent); margin: 0; }
.rv-legend { display: flex; align-items: center; gap: 6px; font-size: 10.5px; color: var(--muted); }
.rv-legend i { flex: 1; height: 6px; border-radius: 3px; background: linear-gradient(90deg, #cfcfcf, #6ec3f0, #1a73c9, #f5e83a, #f39c12, #e53935); }
.rv-sq { background: linear-gradient(135deg, #1a73c9, #f5e83a 55%, #e53935); }

/* Government layers */
.cam-ic.bma span { background: #1f8f4e; }
.cam-ic.pty span { background: #d9480f; }
.cam-ic.off span { opacity: .45; }
.cam-sq.bma { background: #1f8f4e; }
.cam-sq.pty { background: #d9480f; }
/* City cameras are dense: show them once zoomed in to street level */
.mid .cam-ic.bma, .mid .cam-ic.pty, .far .rain-ic.r2 { display: none; }
.cam-view img#camImg { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; background: #0e171b; }
.cam-ext { padding: 10px 12px; display: grid; gap: 8px; font-size: 13px; }
.cam-ext p { margin: 0; }
.cam-ext a.btn { justify-self: start; text-decoration: none; }
.rain-ic span { display: block; width: 100%; height: 100%; border-radius: 50%; border: 1.5px solid #fff; box-shadow: 0 0 0 1px rgb(0 0 0 / .2); box-sizing: border-box; }
.dam-ic span { display: grid; place-items: center; width: 100%; height: 100%; border-radius: 4px 4px 12px 12px; color: #fff; font: 700 11px/1 var(--mono); border: 2px solid #fff; box-shadow: 0 1px 4px rgb(0 0 0 / .35); box-sizing: border-box; }
.tf-ic span { display: grid; place-items: center; width: 100%; height: 100%; border-radius: 50%; background: #c2410c; color: #fff; font: 800 11px/1 var(--font); border: 2px solid #fff; box-shadow: 0 1px 3px rgb(0 0 0 / .4); box-sizing: border-box; }
.tf-sq { background: #c2410c; border-radius: 50%; }
.gov-block { display: grid; gap: 8px; }
.sub-h { margin: 0; font-size: 13.5px; font-weight: 700; }
details.gov-block summary { cursor: pointer; }
.media { display: block; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); background: #0e171b; }
.media img { display: block; width: 100%; height: auto; }
.src-list { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 12.5px; color: var(--muted); }
.src-list a { color: var(--accent); }
.links { display: grid; gap: 6px; }
.links a { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; text-decoration: none; color: var(--ink); }
.links a:hover { border-color: var(--accent); background: var(--accent-soft); }
.links a b { font-weight: 600; }
.links a small { grid-column: 1; color: var(--muted); font-size: 12px; }
.links a .go { grid-row: 1 / span 2; grid-column: 2; align-self: center; color: var(--accent); }
.links a.main { border-color: var(--accent); }
.row-link { color: var(--accent); font-size: 12px; white-space: nowrap; }

/* Live cameras */
.cam-ic span { display: grid; place-items: center; width: 100%; height: 100%; border-radius: 50%; background: #243b53; border: 2px solid #fff; box-shadow: 0 1px 4px rgb(0 0 0 / .4); box-sizing: border-box; }
.cam-ic.on span { background: #0b6e8a; box-shadow: 0 0 0 4px rgb(11 110 138 / .35), 0 1px 4px rgb(0 0 0 / .4); }
.far .cam-ic { transform: scale(.8); }
.cam-sq { background: #243b53; border-radius: 50%; }
.cam-view { position: absolute; z-index: 760; left: 56px; top: 10px; width: min(380px, calc(100% - 66px)); background: var(--panel); color: var(--ink);
  border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 10px 30px rgb(0 0 0 / .3); overflow: hidden; }
.cam-head { display: flex; align-items: flex-start; gap: 8px; padding: 10px 10px 8px 12px; }
.cam-head strong { flex: 1; font-size: 13.5px; line-height: 1.35; }
.cam-x { padding: 3px 9px; }
.cam-view video { display: block; width: 100%; aspect-ratio: 16 / 9; background: #0e171b; }
.cam-status { margin: 0; padding: 8px 12px; font-size: 13px; background: var(--accent-soft); }
.cam-status.bad { background: color-mix(in srgb, var(--l5) 14%, var(--panel)); color: var(--ink); }
.cam-foot { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 8px 12px 10px; font-size: 12px; color: var(--muted); }
.cam-foot a { color: var(--accent); margin-left: auto; }
.cam-near { margin: 8px 0 2px; font-size: 12.5px; padding: 5px 10px; }
@media (max-width: 760px) { .cam-view { left: 10px; width: calc(100% - 20px); } }

/* BMA snapshot + flood-prone roads */
.rp-ic span { display: block; width: 100%; height: 100%; transform: rotate(45deg); border: 2px solid #fff; box-shadow: 0 1px 3px rgb(0 0 0 / .4); box-sizing: border-box; }
.road-ic.snap span { box-shadow: 0 0 0 2px rgb(155 28 28 / .35), 0 1px 4px rgb(0 0 0 / .35); }
.prone-ic span { display: block; width: 100%; height: 100%; border-radius: 3px; border: 2px solid #5b6fae; background: #fff; box-sizing: border-box; }
.prone-sq { background: repeating-linear-gradient(90deg, #5b6fae 0 4px, transparent 4px 7px); }
.snap-pts { margin: 6px 0; padding-left: 18px; }
.snap-pts li { margin: 2px 0; }
#snapRep summary { cursor: pointer; font-weight: 600; padding: 4px 0; }
#snapRep .item:disabled { cursor: default; opacity: .75; }

/* Route planner */
.rt-field { display: grid; gap: 6px; }
.rt-field label { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.rt-dot { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; color: #fff; font: 700 11px/1 var(--mono); }
.rt-dot.a { background: #1f8f4e; }
.rt-dot.b { background: #c62828; }
.rt-in { position: relative; }
.rt-in input { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
.sug { position: absolute; z-index: 900; left: 0; right: 0; top: calc(100% + 4px); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 24px rgb(0 0 0 / .18); overflow: hidden; }
.sug button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 8px 12px; cursor: pointer; font-size: 13px; line-height: 1.35; }
.sug button:hover, .sug button:focus-visible { background: var(--accent-soft); }
.sug .none { padding: 8px 12px; color: var(--muted); font-size: 13px; }
.rt-acts, .rt-veh { display: flex; gap: 6px; flex-wrap: wrap; }
.rt-go { justify-self: start; padding: 9px 18px; font-size: 14.5px; font-weight: 700; }
.rt-go:disabled { opacity: .6; cursor: progress; }
.rt-result { display: grid; gap: 8px; border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.rt-result .big { font-size: 22px; }
.rt-ok { color: var(--l3); font-weight: 600; }
.rt-warn { color: var(--r2); font-weight: 600; }
.rt-result .row { display: flex; gap: 8px; flex-wrap: wrap; }
.rt-result a.btn { text-decoration: none; display: inline-block; }
.rt-pin span { display: grid; place-items: center; width: 100%; height: 100%; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); border: 2.5px solid #fff; box-shadow: 0 2px 6px rgb(0 0 0 / .4); box-sizing: border-box; }
.rt-pin b { transform: rotate(45deg); color: #fff; font: 700 11px/1 var(--mono); }
.rt-pin.a span { background: #1f8f4e; }
.rt-pin.b span { background: #c62828; }

.pulse { animation: pulse 1.8s ease-out infinite; transform-origin: center; transform-box: fill-box; }
@keyframes pulse { 0% { stroke-opacity: .9; stroke-width: 2; } 100% { stroke-opacity: 0; stroke-width: 18; } }
@media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }

@media (max-width: 760px) {
  /* keep the map (top 55vh) visible while filling in a report: dock the sheet over the side panel */
  .sheet { position: fixed; left: 0; right: 0; transform: none; bottom: 0; width: 100%; max-height: 45vh;
    border-radius: 14px 14px 0 0; padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); }
  .depths { grid-template-columns: 1fr 1fr; }
  .depths span { grid-template-columns: 12px 1fr; }
  .depths em { grid-column: 2; text-align: left; }
  body { grid-template-columns: 1fr; grid-template-rows: 55vh 1fr; }
  main { grid-row: 1; }
  aside { grid-row: 2; border-right: 0; border-top: 1px solid var(--line); }
}
</style>
</head>
<body>
<aside>
  <div class="head">
    <div class="head-row">
      <h1>Thai <span>Water</span> Watch</h1>
      <button class="btn" id="lang" type="button">ไทย</button>
    </div>
    <p class="sub" data-t="tagline"></p>
    <div class="updated"><span id="updated">…</span><button class="btn" id="refresh" type="button" data-t="refresh"></button></div>
  </div>

  <section>
    <div id="roadSummary" class="alert"><strong>…</strong></div>
    <div id="summary" class="alert"><strong>…</strong></div>
  </section>

  <section id="govSec" hidden>
    <h2 data-t="govH"></h2>
    <div id="rainSum" class="alert" hidden></div>
    <div class="gov-block">
      <h3 class="sub-h" data-t="radarH"></h3>
      <select id="radarSel" aria-label="Radar"></select>
      <a class="media" href="#" target="_blank" rel="noopener"><img id="radarImg" alt="" loading="lazy"></a>
      <p class="hint" id="radarTime"></p>
    </div>
    <div class="gov-block">
      <h3 class="sub-h" data-t="fcH"></h3>
      <div class="seg" id="fcTabs"></div>
      <a class="media" href="#" target="_blank" rel="noopener"><img id="fcImg" alt="" loading="lazy"></a>
      <p class="hint" data-t="fcNote"></p>
    </div>
    <details class="gov-block" id="damBlock">
      <summary class="sub-h" data-t="damH"></summary>
      <div class="list" id="damList"></div>
    </details>
  </section>

  <section>
    <h2 data-t="linksH"></h2>
    <div class="links" id="linkList"></div>
    <p class="hint" data-t="hotlines"></p>
  </section>

  <section>
    <h2 data-t="srcH"></h2>
    <ul class="src-list" id="srcList"></ul>
    <p class="hint" data-t="privacyNote"></p>
  </section>

  <section id="snapSec" hidden>
    <h2 id="snapH"></h2>
    <p class="hint" id="snapNote"></p>
    <div class="list" id="snapList"></div>
    <details id="snapRep">
      <summary id="snapRepH"></summary>
      <div class="list" id="snapRepList"></div>
    </details>
    <p class="note" id="snapCredit"></p>
  </section>

  <section id="routeSec" hidden>
    <h2 data-t="routeH"></h2>
    <p class="hint" data-t="routeIntro"></p>
    <div class="rt-field">
      <label for="rtFrom"><span class="rt-dot a">A</span><span data-t="rtFrom"></span></label>
      <div class="rt-in"><input id="rtFrom" type="text" autocomplete="off" enterkeyhint="search"><div class="sug" id="sugFrom" hidden></div></div>
      <div class="rt-acts"><button class="btn" type="button" id="rtFromMe" data-t="rtMe"></button><button class="btn" type="button" id="rtFromMap" data-t="rtOnMap"></button></div>
    </div>
    <div class="rt-field">
      <label for="rtTo"><span class="rt-dot b">B</span><span data-t="rtTo"></span></label>
      <div class="rt-in"><input id="rtTo" type="text" autocomplete="off" enterkeyhint="search"><div class="sug" id="sugTo" hidden></div></div>
      <div class="rt-acts"><button class="btn" type="button" id="rtToMap" data-t="rtOnMap"></button></div>
    </div>
    <div class="rt-veh" id="rtVeh" role="radiogroup">
      <button class="btn" type="button" data-veh="motorbike" data-t="vehMoto"></button>
      <button class="btn on" type="button" data-veh="car" data-t="vehCar"></button>
      <button class="btn" type="button" data-veh="suv" data-t="vehSuv"></button>
    </div>
    <button class="btn on rt-go" type="button" id="rtGo" data-t="rtGo"></button>
    <p class="err" id="rtErr" hidden></p>
    <div id="rtResult" class="rt-result" hidden></div>
  </section>

  <section>
    <h2 data-t="goTo"></h2>
    <div class="chips" id="places"></div>
    <select id="province" aria-label="Province"></select>
    <select id="district" aria-label="Bangkok district"></select>
  </section>

  <section>
    <h2 data-t="layersH"></h2>
    <div class="layers">
      <label><input type="checkbox" id="showRoads" checked><span class="sq" style="background:var(--r4)"></span><span data-t="layerRoads"></span><span class="count" id="roadCount"></span></label>
      <label><input type="checkbox" id="showRivers" checked><span class="dot" style="background:var(--l4)"></span><span data-t="layerRivers"></span><span class="count" id="riverCount"></span></label>
      <label id="trafficRow" hidden><input type="checkbox" id="showTraffic" checked><span class="sq traffic-sq"></span><span data-t="layerTraffic"></span></label>
      <label id="snapRow" hidden><input type="checkbox" id="showSnap" checked><span class="sq" style="background:#9b1c1c"></span><span id="snapLbl"></span><span class="count" id="snapCount"></span></label>
      <label id="proneRow" hidden><input type="checkbox" id="showProne"><span class="sq prone-sq"></span><span data-t="layerProne"></span><span class="count" id="proneCount"></span></label>
      <label id="rowCams" hidden><input type="checkbox" id="showCams" checked><span class="sq cam-sq"></span><span data-t="layerCams"></span><span class="count" id="countCams"></span></label>
      <label id="rowBmaCams" hidden><input type="checkbox" id="showBmaCams" checked><span class="sq cam-sq bma"></span><span><span data-t="layerBmaCams"></span><br><small class="hint" data-t="camZoomHint"></small> <a class="row-link" href="http://www.bmatraffic.com/index.aspx" target="_blank" rel="noopener" data-t="bmaSiteLink"></a></span><span class="count" id="countBmaCams"></span></label>
      <label id="rowPtyCams" hidden><input type="checkbox" id="showPtyCams"><span class="sq cam-sq pty"></span><span data-t="layerPtyCams"></span><span class="count" id="countPtyCams"></span></label>
      <label id="rowRain" hidden><input type="checkbox" id="showRain"><span class="sq" style="background:#1f4fbf;border-radius:50%"></span><span data-t="layerRain"></span><span class="count" id="rainCount"></span></label>
      <label id="rowRadar"><input type="checkbox" id="showRadarOverlay" checked><span class="sq rv-sq"></span><span data-t="layerRadar"></span></label>
      <label id="rowDams" hidden><input type="checkbox" id="showDams" checked><span class="sq" style="background:#1f4fe0"></span><span data-t="layerDams"></span></label>
      <label id="rowTraffy" hidden><input type="checkbox" id="showTraffy" checked><span class="sq tf-sq"></span><span data-t="layerTraffy"></span><span class="count" id="traffyCount"></span></label>
    </div>
    <div class="basemap" id="baseRow" hidden>
      <span data-t="baseMap"></span>
      <div class="seg">
        <button type="button" class="btn" data-base="google">Google Maps</button>
        <button type="button" class="btn" data-base="osm">OpenStreetMap</button>
      </div>
    </div>
  </section>

  <section>
    <h2 data-t="roadScaleH"></h2>
    <div class="roadscale" id="roadscale"></div>
  </section>

  <section>
    <h2 data-t="roadListH"></h2>
    <div class="list" id="roadList"></div>
  </section>

  <section>
    <h2 data-t="levels"></h2>
    <div class="legend" id="legend"></div>
  </section>

  <section>
    <h2 data-t="watchList"></h2>
    <div class="list" id="list"></div>
  </section>

  <section>
    <p class="note" data-t="roadSource"></p>
    <p class="note" data-t="source"></p>
  </section>
</aside>

<main>
  <div id="map"></div>
  <div class="status" id="status" data-t="loading"></div>

  <button class="fab" id="reportBtn" type="button" data-t="reportBtn"></button>

  <div class="sheet pickbar" id="pickBar" hidden>
    <strong data-t="pickTitle"></strong>
    <div class="row">
      <button class="btn" type="button" id="pickLoc" data-t="pickLoc"></button>
      <button class="btn" type="button" id="pickCancel" data-t="cancel"></button>
    </div>
  </div>

  <div class="sheet" id="reportForm" hidden>
    <form id="rf">
      <strong data-t="rfTitle"></strong>
      <p class="hint" data-t="rfDrag"></p>
      <fieldset>
        <legend data-t="rfDepthQ"></legend>
        <div class="depths">
          <label><input type="radio" name="depth" value="5" id="d5"><span><i class="sq" style="background:var(--r1)"></i><b data-t="d5"></b><em data-t="d5s"></em></span></label>
          <label><input type="radio" name="depth" value="15" id="d15"><span><i class="sq" style="background:var(--r2)"></i><b data-t="d15"></b><em data-t="d15s"></em></span></label>
          <label><input type="radio" name="depth" value="25" id="d25"><span><i class="sq" style="background:var(--r3)"></i><b data-t="d25"></b><em data-t="d25s"></em></span></label>
          <label><input type="radio" name="depth" value="40" id="d40"><span><i class="sq" style="background:var(--r4)"></i><b data-t="d40"></b><em data-t="d40s"></em></span></label>
          <label><input type="radio" name="depth" value="closed" id="dclosed"><span><i class="sq" style="background:var(--r4)"></i><b data-t="dclosed"></b><em data-t="dcloseds"></em></span></label>
        </div>
      </fieldset>
      <label class="note-in"><span data-t="rfNoteQ"></span>
        <textarea id="rfNote" maxlength="200" rows="2"></textarea>
      </label>
      <p class="err" id="rfErr" hidden></p>
      <p class="hint" data-t="rfPublic"></p>
      <div class="row">
        <button class="btn on" type="submit" id="rfSend" data-t="rfSend"></button>
        <button class="btn" type="button" id="rfCancel" data-t="cancel"></button>
      </div>
    </form>
  </div>



  <div class="rv-bar" id="rvBar" hidden>
    <button class="btn rv-play" type="button" id="rvPlay" aria-label="Play">▶</button>
    <div class="rv-mid">
      <div class="rv-top"><strong data-t="rvTitle"></strong><span id="rvTime"></span></div>
      <input type="range" id="rvSlider" min="0" max="11" step="1" value="11" aria-label="Radar time">
      <div class="rv-legend"><span data-t="rvLight"></span><i></i><span data-t="rvHeavy"></span></div>
    </div>
  </div>
  <div class="cam-view" id="camView" role="dialog" aria-labelledby="camTitle" hidden>
    <div class="cam-head">
      <strong id="camTitle"></strong>
      <button class="btn cam-x" type="button" id="camClose" aria-label="Close">✕</button>
    </div>
    <video id="camVideo" muted autoplay playsinline controls></video>
    <img id="camImg" alt="" hidden>
    <div class="cam-ext" id="camExt" hidden></div>
    <p class="cam-status" id="camStatus" hidden></p>
    <div class="cam-foot">
      <span id="camOrg"></span>
      <button class="btn" type="button" id="camResume" hidden data-t="camResume"></button>
      <a id="camMore" href="https://live.iticfoundation.org/" target="_blank" rel="noopener" data-t="camMore"></a>
    </div>
  </div>
  <div class="toast" id="toast" role="status" hidden></div>
</main>

// Show the visitor's position; for a report, drop the pin there instead of flying
function locate(forPick) {
  if (!navigator.geolocation) return toast(T().locErr, true);
  navigator.geolocation.getCurrentPosition(p => {
    const ll = { lat: p.coords.latitude, lng: p.coords.longitude };
    if (locMarker) locMarker.remove();
    locMarker = map.marker({ ...ll, cls: "me", html: "<span></span>", w: 18, h: 18, z: 4000 });
    locMarker.show();
    if (forPick && picking) placePick(ll);
    else map.flyTo([ll.lat, ll.lng], 13);
  }, () => toast(T().locErr, true), { enableHighAccuracy: true, timeout: 10000 });
}

function levelOf(s) { return s.level >= 1 && s.level <= 5 ? s.level : 0; }
function ageHours(s) { return s.time ? (Date.now() - new Date(s.time.replace(" ", "T") + ":00+07:00")) / 36e5 : Infinity; }
function fmt(v, d = 2) { return v == null || isNaN(v) ? "–" : v.toFixed(d); }

function popupHtml(s) {
  const t = T(), c = COLORS(), lv = levelOf(s);
  const pct = s.pct;
  const diff = s.msl != null && s.prev != null ? s.msl - s.prev : null;
  const trend = diff == null ? "–" : diff > 0.005 ? t.rising : diff < -0.005 ? t.falling : t.steady;
  const w = pct == null ? 0 : Math.max(0, Math.min(pct, 130)) / 130 * 100;
  const gq = encodeURIComponent(`${s.lat},${s.lng}`);
  return `<div class="pop">
    <h3>${nm(s.name)}</h3>
    <div class="where">${[nm(s.amphoe), nm(s.province)].filter(Boolean).join(", ")} · ${nm(s.basin)}</div>
    <span class="pill" style="background:${c[lv]}">${t.lvl[lv]}</span>
    <strong style="margin-left:6px">${pct == null ? "" : fmt(pct, 0) + "%"}</strong> <span style="color:var(--muted)">${pct == null ? "" : t.ofBank}</span>
    <div class="gauge"><i style="width:${w}%;background:${c[lv]}"></i><b style="left:${100 / 130 * 100}%"></b></div>
    <dl class="kv">
      <dt>${t.waterMsl}</dt><dd>${fmt(s.msl)} ${t.msl}</dd>
      <dt>${t.bank}</dt><dd>${fmt(s.bank)} ${t.msl}</dd>
      <dt>${t.ground}</dt><dd>${fmt(s.ground)} ${t.msl}</dd>
      <dt>${t.trend}</dt><dd>${trend}${diff == null ? "" : ` (${diff >= 0 ? "+" : ""}${fmt(diff)} m)`}</dd>
      <dt>${t.measured}</dt><dd>${s.time || "–"}</dd>
    </dl>
    ${ageHours(s) > 6 ? `<div class="stale">${t.stale}</div>` : ""}
    ${camBtn(s.lat, s.lng)}
    <a class="gmaps" href="https://www.google.com/maps/search/?api=1&query=${gq}" target="_blank" rel="noopener">${t.openGmaps}</a>
  </div>`;
}

function buildMarkers() {
  markers.forEach(m => m.remove());
  const c = COLORS();
  // draw low levels first so overflowing stations sit on top
  markers = [...data.stations].sort((a, b) => levelOf(a) - levelOf(b)).map(s => {
    const lv = levelOf(s), size = lv === 5 ? 18 : lv === 4 ? 14 : 11;
    return map.marker({
      lat: s.lat, lng: s.lng, w: size, h: size, z: lv * 10, data: s,
      cls: `st st${lv}`, html: `<span style="background:${c[lv]}"></span>`,
      title: `${nm(s.name)} · ${s.pct == null ? "–" : fmt(s.pct, 0) + "%"}`,
      popup: () => popupHtml(s),
    });
  });
  applyFilter();
}

function applyFilter() {
  const prov = document.getElementById("province").value;
  const rivers = document.getElementById("showRivers").checked, roads = document.getElementById("showRoads").checked;
  markers.forEach(m => {
    const s = m.data;
    rivers && shown.has(levelOf(s)) && (!prov || s.provinceCode === prov) ? m.show() : m.hide();
  });
  roadMarkers.forEach(m => roads ? m.show() : m.hide());
  updateView();
}

function updateView() {
  updateRoadView();
  renderSnapSection();
  if (!data) return;
  const t = T(), c = COLORS(), b = map.getBounds();
  const prov = document.getElementById("province").value;
  const inView = data.stations.filter(s => inArea(s.lat, s.lng, b) && (!prov || s.provinceCode === prov));

  // legend counts reflect the current view
  const counts = [0,0,0,0,0,0];
  inView.forEach(s => counts[levelOf(s)]++);
  document.getElementById("legend").innerHTML = [5,4,3,2,1,0].map(i => `
    <label><input type="checkbox" id="lv${i}" data-lv="${i}" ${shown.has(i) ? "checked" : ""}>
      <span class="dot" style="background:${c[i]}"></span>
      <span>${t.lvl[i]}<span class="range">${t.range[i]}</span></span>
      <span class="count">${counts[i]}</span></label>`).join("");

  const sum = document.getElementById("summary");
  if (counts[5]) { sum.className = "alert bad"; sum.innerHTML = `<strong>${t.sumBad(counts[5], where())}</strong><small>${t.sumBadHint}</small>`; }
  else if (counts[4]) { sum.className = "alert warn"; sum.innerHTML = `<strong>${t.sumWarn(counts[4], where())}</strong><small>${t.sumWarnHint}</small>`; }
  else { sum.className = "alert ok"; sum.innerHTML = `<strong>${t.sumOk(where())}</strong><small>${t.sumOkHint} (${inView.length} ${t.stations})</small>`; }

  const top = inView.filter(s => levelOf(s) >= 4 && shown.has(levelOf(s))).sort((a, b) => (b.pct ?? 0) - (a.pct ?? 0)).slice(0, 12);
  document.getElementById("list").innerHTML = top.length ? top.map(s => `

      <span class="pct">${fmt(s.pct, 0)}%</span>
    </button>`).join("") : `<div class="empty">${t.noneHigh(where())}</div>`;
}

// ---- Flooded roads (Longdo Traffic / iTIC reports) ----
const RCOL = () => { const s = getComputedStyle(document.documentElement); return ["--r0","--r1","--r2","--r3","--r4","--r5"].map(k => s.getPropertyValue(k).trim()); };
// 1 shallow (≤10cm), 2 deep (10–20), 3 very deep (20–30), 4 impassable (>30 or closed), 5 depth not reported
function roadCat(r) {
  if (r.closed) return 4;
  const d = r.depth;
  if (d == null) return 5;
  return d <= 10 ? 1 : d <= 20 ? 2 : d <= 30 ? 3 : 4;
}
const SEV = [0, 2, 3, 4, 5, 1]; // sort order: impassable first, unknown depth last
const fmtTime = iso => iso ? new Date(iso).toLocaleString(lang === "th" ? "th-TH" : "en-GB", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : "–";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

function roadIcon(r) {
  const c = roadCat(r), col = RCOL()[c];
  const label = r.closed && r.depth == null ? "✕" : r.depth != null ? `${Math.round(r.depth)}<small>${T().cm}</small>` : "?";
  const w = r.depth != null ? 52 : 26;
  return { cls: "road-ic wet" + (r.community ? " comm" : ""), html: `<span style="background:${col}">${label}</span>`, w, h: 22 };
}

function roadPopup(r) {
  const t = T(), c = roadCat(r), col = RCOL()[c];
  const gq = encodeURIComponent(`${r.lat},${r.lng}`);
  const tag = r.closed ? t.closedTag : r.passable ? t.passableTag : "";
  const desc = nm(r.desc);
  return `<div class="pop">
    <h3>${esc(nm(r.title))}</h3>
    ${r.depth != null ? `<div class="depthbar"><span class="big" style="color:${col}">${Math.round(r.depth)}</span><span>${t.cm} ${t.depthNow}</span></div>` : ""}
    <span class="pill" style="background:${col}">${t.roadCat[c]}</span> <span style="margin-left:4px">${t.roadAdvice[c]}</span>
    ${tag ? `<div style="margin-top:6px;font-weight:600">${tag}</div>` : ""}
    <dl class="kv">
      ${r._d ? `<dt>${t.districtLbl}</dt><dd style="font-family:var(--font)">${esc(nm(r._d))}</dd>` : ""}
      <dt>${t.src}</dt><dd style="font-family:var(--font)">${t.srcName[r.source]}</dd>
      <dt>${t.reported}</dt><dd>${fmtTime(r.start)}</dd>
      <dt>${t.until}</dt><dd>${fmtTime(r.stop)}</dd>
    </dl>
    ${r.community ? `<div class="votes">
      <span class="vq">${t.stillQ}</span>
      <button class="btn" type="button" data-vote="still" data-id="${esc(r.id)}">${t.voteStill} · ${r.still}</button>
      <button class="btn" type="button" data-vote="cleared" data-id="${esc(r.id)}">${t.voteCleared} · ${r.cleared}</button>
      ${mine()[r.id] ? `<button class="btn del" type="button" data-del="${esc(r.id)}">${t.deleteMine}</button>` : ""}
    </div>` : ""}
    ${desc ? `<details><summary>${t.details}</summary><p style="white-space:pre-line;margin:6px 0 0;font-size:12px">${esc(desc)}</p></details>` : ""}
    ${camBtn(r.lat, r.lng)}
    ${r.image ? `<a href="${esc(r.image)}" target="_blank" rel="noopener"><img src="${esc(r.image)}" alt="" style="margin-top:8px;border-radius:6px;max-height:140px;width:100%;object-fit:cover"></a>` : ""}
    <a class="gmaps" href="https://www.google.com/maps/search/?api=1&query=${gq}" target="_blank" rel="noopener">${t.openGmaps}</a>
  </div>`;
}

function buildRoadMarkers() {
  roadMarkers.forEach(m => m.remove());
  roadMarkers = roadData.reports.map(r => map.marker({
    lat: r.lat, lng: r.lng, ...roadIcon(r), z: 1000 + SEV[roadCat(r)] * 100, data: r,
    title: nm(r.title), popup: () => roadPopup(r),
  }));
  applyFilter();
}

function updateRoadView() {
  const t = T(), rc = RCOL();
  document.querySelector('[data-t="roadListH"]').textContent = t.roadListH + (lang === "th" ? "" : " ") + where();
  document.getElementById("roadscale").innerHTML = [1,2,3,4,5].map(i =>
    `<div><span class="sq" style="background:${rc[i]}"></span><span class="cm">${t.roadCm[i]}</span><span>${t.roadAdvice[i]}</span></div>`).join("");
  const sum = document.getElementById("roadSummary"), list = document.getElementById("roadList");
  if (!roadData) {
    sum.className = "alert"; sum.innerHTML = roadErr ? `<strong>${t.roadErr}</strong><small>${esc(roadErr)}</small>` : `<strong>…</strong>`;
    list.innerHTML = ""; return;
  }
  const b = map.getBounds();
  const inView = roadData.reports.filter(r => inArea(r.lat, r.lng, b))
    .sort((a, b) => SEV[roadCat(b)] - SEV[roadCat(a)] || (b.depth ?? 0) - (a.depth ?? 0) || Date.parse(b.start) - Date.parse(a.start));
  document.getElementById("roadCount").textContent = roadData.reports.length;
  if (inView.length) {
    const closed = inView.filter(r => roadCat(r) === 4).length, deep = inView.filter(r => roadCat(r) === 3).length;
    sum.className = closed || deep ? "alert bad" : "alert warn";
    sum.innerHTML = `<strong>${t.roadSumBad(inView.length, where())}</strong><small>${t.roadSumBadHint(closed, deep)}</small>`;
  } else { sum.className = "alert ok"; sum.innerHTML = `<strong>${t.roadSumOk(where())}</strong><small>${t.roadSumOkHint}</small>`; }
  list.innerHTML = inView.length ? inView.slice(0, 25).map(r => `
    <button class="item" type="button" data-road="${esc(r.id)}">
      <span class="bar" style="background:${rc[roadCat(r)]}"></span>
      <span><span class="nm">${esc(nm(r.title))}</span><br><span class="pv">${r._d ? esc(nm(r._d)) + " · " : ""}${t.roadCat[roadCat(r)]} · ${fmtTime(r.start)}</span></span>
      <span class="pct">${r.depth != null ? Math.round(r.depth) + " " + t.cm : r.closed ? "✕" : ""}</span>
    </button>`).join("") : `<div class="empty">${t.noRoadFlood(where())}</div>`;
}

let officialReports = [], communityReports = [];
function mine() { try { return JSON.parse(localStorage.getItem("tww-mine") || "{}"); } catch { return {}; } }
function saveMine(o) { try { localStorage.setItem("tww-mine", JSON.stringify(o)); } catch {} }
const fromCommunity = c => ({
  ...c, source: "community", community: true,
  title: { th: c.note || "รายงานจากผู้ใช้", en: c.note || "Report from a visitor" }, desc: {},

async function loadRoads() {
  const [off, com] = await Promise.allSettled([
    fetch("/api/roadflood").then(async r => { const j = await r.json(); if (!r.ok) throw new Error(j.error || r.status); return j.reports; }),
    fetch("/api/reports").then(async r => { const j = await r.json(); if (!r.ok) throw new Error(j.error || r.status); return j.reports; }),
  ]);
  if (off.status === "fulfilled") officialReports = off.value;
  if (com.status === "fulfilled") communityReports = com.value;
  roadErr = off.status === "rejected" ? off.reason.message : null;
  if (off.status === "rejected" && !officialReports.length && !communityReports.length) return updateRoadView();
  mergeRoads();
}

// ---- Bangkok districts (เขต) ----
let DISTRICTS = [], selDistrict = null, districtOutline = null;
function inRing(x, y, ring) {
  let inside = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const [xi, yi] = ring[i], [xj, yj] = ring[j];
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}
function inDistrict(lat, lng, d) {
  const [s, w, n, e] = d.bbox;
  if (lat < s || lat > n || lng < w || lng > e) return false;
  return d.polys.some(([outer, ...holes]) => inRing(lng, lat, outer) && !holes.some(h => inRing(lng, lat, h)));
}
const districtOf = (lat, lng) => DISTRICTS.find(d => inDistrict(lat, lng, d)) || null;
// A chosen district replaces "what's on screen" as the area the panel summarises
const inArea = (lat, lng, b) => selDistrict ? inDistrict(lat, lng, selDistrict) : b.contains([lat, lng]);
const where = () => selDistrict ? T().inDistrict(nm(selDistrict)) : T().inView;

function tagDistricts() {
  if (roadData) roadData.reports.forEach(r => { r._d = districtOf(r.lat, r.lng); });
}
function renderDistrictSelect() {
  const sel = document.getElementById("district"); if (!sel) return;
  const t = T(), counts = {};
  if (roadData) roadData.reports.forEach(r => { if (r._d) counts[r._d.code] = (counts[r._d.code] || 0) + 1; });
  const cur = selDistrict ? selDistrict.code : "";
  sel.innerHTML = `<option value="">${t.allDistricts}</option>` + [...DISTRICTS]
    .sort((a, b) => nm(a).localeCompare(nm(b), lang))
    .map(d => `<option value="${d.code}">${esc(nm(d))}${counts[d.code] ? ` · ${counts[d.code]} ${lang === "th" ? "จุด" : "flooded"}` : ""}</option>`).join("");
  sel.value = cur;
  sel.hidden = !DISTRICTS.length;
}
function chooseDistrict(code) {
  selDistrict = DISTRICTS.find(d => d.code === code) || null;
  if (districtOutline) { districtOutline.remove(); districtOutline = null; }
  if (selDistrict) {
    ev("district_pick");
    document.getElementById("province").value = "";
    applyFilter();
    districtOutline = map.outline(selDistrict.polys);
    const [s, w, n, e] = selDistrict.bbox;
    map.flyToBounds([[s, w], [n, e]], { padding: 30 });
  }
  document.getElementById("district").value = selDistrict ? selDistrict.code : "";
  updateView();
}
async function loadDistricts() {
  try {
    DISTRICTS = await (await fetch("bangkok-districts.json")).json();
    tagDistricts();
    renderDistrictSelect();
    if (roadData) buildRoadMarkers();
  } catch (e) { console.warn("Districts unavailable:", e.message); }
}

// ---- Report flow ----
let picking = false, pickMarker = null;
const $ = id => document.getElementById(id);
function toast(msg, bad) {
  const el = $("toast"); el.textContent = msg; el.className = "toast" + (bad ? " bad" : ""); el.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => { el.hidden = true; }, 4000);
}
function startReport() {
  map.closePopup();
  picking = true;
  $("pickBar").hidden = false; $("reportBtn").hidden = true;
  $("map").classList.add("picking");
}
function endReport() {
  picking = false;
  $("pickBar").hidden = true; $("reportForm").hidden = true; $("reportBtn").hidden = false;
  $("map").classList.remove("picking");
  if (pickMarker) { pickMarker.remove(); pickMarker = null; }
  $("rf").reset(); $("rfErr").hidden = true;
}
function placePick(latlng) {
  if (!pickMarker) {
    pickMarker = map.marker({ ...latlng, cls: "pick-ic", html: "<span></span>", w: 26, h: 26, ax: 13, ay: 26, z: 5000, draggable: true });

// ---- Live traffic cameras: iTIC/DOH (video), BMA (still images every 30 s), Pattaya City (watch on their site) ----
let BMA_LIVE = true;
let CAMS = [], camMarkers = [], camHls = null, camOpen = null, camLoadTimer = null, camStopTimer = null, camImgTimer = null;
const HLS_SRC = "https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js";
const CAM_MAX_MS = 90 * 1000;        // video streams are ~3 Mbps (about 25 MB a minute): pause after 90 s
const CAM_IMG_MAX_MS = 5 * 60 * 1000; // BMA stills are ~45 KB every 30 s: stop refreshing after 5 min
const CAM_ICON = `<span><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path fill="#fff" d="M4 7h11a2 2 0 0 1 2 2v1.5l3.2-2.1A.5.5 0 0 1 21 8.8v6.4a.5.5 0 0 1-.8.4L17 13.5V15a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2z"/></svg></span>`;
const CAM_TOGGLE = { itic: "showCams", bma: "showBmaCams", pty: "showPtyCams" };
const PATTAYA_SITE = "https://livestream.pattaya.go.th/";

function distMeters(aLat, aLng, bLat, bLng) {
  const k = Math.PI / 180, x = (bLng - aLng) * k * Math.cos((aLat + bLat) / 2 * k), y = (bLat - aLat) * k;
  return Math.hypot(x, y) * 6371000;
}
// Nearest camera we can show inside the site (video or BMA stills)
function nearestCam(lat, lng, maxM = 1500) {
  let best = null, bd = Infinity;
  for (const c of CAMS) {
    if (c.src === "pty") continue;
    const d = distMeters(lat, lng, c.lat, c.lng);
    if (d < bd) { bd = d; best = c; }
  }
  return best && bd <= maxM ? { cam: best, d: bd } : null;
}
const fmtDist = m => m < 1000 ? `${Math.round(m / 10) * 10} ${lang === "th" ? "ม." : "m"}` : `${(m / 1000).toFixed(1)} ${T().km}`;
function camBtn(lat, lng) {
  const n = CAMS.length && nearestCam(lat, lng);
  return n ? `<button class="btn cam-near" type="button" data-cam="${esc(n.cam.key)}">▶ ${T().camNear(fmtDist(n.d))}</button>` : "";
}

function drawCams() {
  camMarkers.forEach(m => m.remove()); camMarkers = [];
  const on = { itic: $("showCams").checked, bma: $("showBmaCams").checked, pty: $("showPtyCams").checked };
  camMarkers = CAMS.filter(c => on[c.src]).map(c => {
    const m = map.marker({ lat: c.lat, lng: c.lng, cls: `cam-ic ${c.src}${c.online === false ? " off" : ""}${camOpen === c.key ? " on" : ""}`,
      html: CAM_ICON, w: 22, h: 22, z: 200, title: c.title, onClick: () => openCam(c.key), data: c });
    m.show();
    return m;
  });
}

let hlsLoading = null;
function loadHls() {
  if (window.Hls) return Promise.resolve();
  if (!hlsLoading) hlsLoading = new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = HLS_SRC; s.onload = res; s.onerror = () => { hlsLoading = null; rej(new Error("hls.js failed to load")); };
    document.head.appendChild(s);
  });
  return hlsLoading;
}
function camStatus(msg, bad) {
  const el = $("camStatus");
  el.textContent = msg || ""; el.hidden = !msg; el.classList.toggle("bad", !!bad);
}
function stopStream() {
  clearTimeout(camLoadTimer); clearTimeout(camStopTimer); clearInterval(camImgTimer);
  if (camHls) { camHls.destroy(); camHls = null; }
  const v = $("camVideo");
  v.pause(); v.removeAttribute("src"); v.load();
  $("camImg").onload = $("camImg").onerror = null;
}

async function openCam(key) {
  const c = CAMS.find(x => x.key === key); if (!c) return;
  ev("cam_" + c.src);
  const t = T(), v = $("camVideo"), img = $("camImg");
  map.closePopup();
  stopStream();
  camOpen = key;
  $("camView").hidden = false;
  $("camTitle").textContent = c.title;
  $("camOrg").textContent = t.camOrg[c.org || c.src];
  $("camResume").hidden = true;
  // BMA: open this same camera on BMA's traffic site
  $("camMore").href = c.src === "bma" ? `${BMA_TRAFFIC}PlayVideo.aspx?ID=${encodeURIComponent(c.id)}` : "https://live.iticfoundation.org/";
  $("camMore").textContent = t.camMoreBy[c.src];
  $("camMore").hidden = c.src === "pty";
  v.hidden = c.src !== "itic"; img.hidden = c.src !== "bma"; $("camExt").hidden = c.src !== "pty";
  drawCams();

  if (c.src === "pty") {
    camStatus(c.online === false ? t.camPtyOffline : "");
    $("camExt").innerHTML = `<p>${t.camPtyInfo(esc(c.title))}</p><a class="btn on" href="${PATTAYA_SITE}" target="_blank" rel="noopener">${t.camPtyGo}</a>`;
    return;
  }

  if (c.src === "bma") {
    // Still images through our server (BMA's site needs a session); refresh every 30 s
    camStatus(t.camLoading);
    const load = () => { img.src = `/api/gov/bma-cam/${encodeURIComponent(c.id)}.jpg?t=${Date.now()}`; };
    img.onload = () => camStatus(t.camBmaInfo(new Date().toLocaleTimeString(lang === "th" ? "th-TH" : "en-GB", { hour: "2-digit", minute: "2-digit", second: "2-digit" })));
    const external = () => {
      stopStream(); img.hidden = true; $("camExt").hidden = false;
      $("camMore").hidden = true;   // the button below already opens this camera on BMA's site
      camStatus("");
      $("camExt").innerHTML = `<p>${t.camBmaExternal}</p><a class="btn on" href="http://www.bmatraffic.com/PlayVideo.aspx?ID=${encodeURIComponent(c.id)}" target="_blank" rel="noopener">${t.camBmaGo}</a>`;
    };
    if (!BMA_LIVE) return external();
    img.onerror = external;
    load();
    camImgTimer = setInterval(load, 30000);
    camStopTimer = setTimeout(() => { stopStream(); camStatus(t.camPausedImg); $("camResume").hidden = false; }, CAM_IMG_MAX_MS);
    return;
  }

  // iTIC / DOH live video
  camStatus(t.camLoading);
  v.onplaying = () => camStatus("");
  camLoadTimer = setTimeout(() => { if (v.readyState < 2) camStatus(t.camSlow, true); }, 15000);
  camStopTimer = setTimeout(() => { stopStream(); camStatus(t.camPaused); $("camResume").hidden = false; }, CAM_MAX_MS);
  try {
    // Prefer hls.js (robust live playback); fall back to the browser's own HLS (older iPhones)
    try { await loadHls(); } catch {}
    if (camOpen !== key) return;             // viewer switched cameras while loading
    if (!(window.Hls && Hls.isSupported())) {
      if (!v.canPlayType("application/vnd.apple.mpegurl")) { camStatus(t.camNoSupport, true); return; }
      v.src = c.hls;
      v.onerror = () => camStatus(t.camOffline, true);
    } else {
      camHls = new Hls({ liveSyncDurationCount: 2, maxBufferLength: 8 });
      camHls.on(Hls.Events.ERROR, (e, d) => { if (d.fatal) { stopStream(); camStatus(t.camOffline, true); } });
      camHls.loadSource(c.hls);
      camHls.attachMedia(v);
    }
    const p = v.play(); if (p) p.catch(() => {});
  } catch (e) {
    camStatus(t.camOffline, true);
  }
}
function closeCam() {
  stopStream();
  camOpen = null;
  $("camView").hidden = true;
  drawCams();
}
async function loadCams() {
  const get = u => fetch(u).then(r => r.json()).then(j => j.cameras || []).catch(() => []);
  const bmaRes = fetch("/api/gov/bma-cameras").then(r => r.json()).catch(() => ({}));
  const [itic, pty, bj] = await Promise.all([get("/api/cameras"), get("/api/gov/pattaya-cameras"), bmaRes]);
  const bma = bj.cameras || [];
  BMA_LIVE = bj.live !== false;
  CAMS = [
    ...itic.map(c => ({ ...c, src: "itic", key: "itic:" + c.id })),
    ...bma.map(c => ({ ...c, src: "bma", key: "bma:" + c.id, title: c.title + (c.dir ? ` (${c.dir})` : "") })),
    ...pty.map(c => ({ ...c, src: "pty", key: "pty:" + c.id })),
  ];
  const n = { itic: itic.length, bma: bma.length, pty: pty.length };
  for (const s of Object.keys(n)) { $(CAM_TOGGLE[s].replace("show", "row")).hidden = !n[s]; $(CAM_TOGGLE[s].replace("show", "count")).textContent = n[s]; }
  drawCams();
}

// ---- Rain radar over the map (RainViewer composite of national weather radars, last 2 hours) ----
const RV_API = "https://api.rainviewer.com/public/weather-maps.json";
// Radar fades as you zoom in: free tiles stop at zoom 7, so closer up they're enlarged and blocky
// and would otherwise hide the streets underneath.
const rvOpacity = () => { const z = map.getZoom(); return z <= 7 ? 0.6 : z <= 9 ? 0.5 : z <= 11 ? 0.4 : 0.3; };
let RV = null, rvLayers = new Map(), rvIdx = 0, rvTimer = null, rvRefresh = null;

async function loadRadarFrames() {
  const j = await fetch(RV_API).then(r => r.json());
  RV = { host: j.host, frames: (j.radar && j.radar.past) || [] };
  // drop layers for frames that have rolled out of the 2-hour window
  const keep = new Set(RV.frames.map(f => f.path));
  for (const [p, l] of rvLayers) if (!keep.has(p)) { l.remove(); rvLayers.delete(p); }
  $("rvSlider").max = Math.max(0, RV.frames.length - 1);
}
function rvLayer(f) {
  if (!rvLayers.has(f.path)) {
    rvLayers.set(f.path, map.tileOverlay({
      // colour scheme 4 (grey/blue → yellow → red), smoothed; free tiles exist up to zoom 7 and are enlarged beyond
      url: (z, x, y) => `${RV.host}${f.path}/256/${z}/${x}/${y}/4/1_0.png`,
      maxNativeZoom: 7, opacity: 0, zIndex: 6,
      attribution: '<a href="https://www.rainviewer.com/" target="_blank" rel="noopener">RainViewer</a>',
    }));
  }
  return rvLayers.get(f.path);
}
function rvShow(i) {
  if (!RV || !RV.frames.length) return;
  rvIdx = (i + RV.frames.length) % RV.frames.length;
  const f = RV.frames[rvIdx];
  rvLayer(f).setOpacity(rvOpacity());
  for (const [p, l] of rvLayers) if (p !== f.path) l.setOpacity(0);
  const t = T(), when = new Date(f.time * 1000), ago = Math.round((Date.now() - when) / 60000);
  $("rvTime").textContent = `${when.toLocaleTimeString(lang === "th" ? "th-TH" : "en-GB", { hour: "2-digit", minute: "2-digit" })} · ${t.rvAgo(ago)}`;
  $("rvSlider").value = rvIdx;
}
function rvPlay(on) {
  clearInterval(rvTimer); rvTimer = null;
  $("rvPlay").textContent = on ? "❚❚" : "▶";
  $("rvPlay").setAttribute("aria-label", on ? T().rvPause : T().rvPlayLbl);
  if (!on) return;
  ev("radar_play");
  RV.frames.forEach(rvLayer);            // start loading every frame so the loop is smooth
  rvTimer = setInterval(() => rvShow(rvIdx + 1), 700);
}
async function setRadarOverlay(on) {
  clearInterval(rvRefresh); rvPlay(false);
  if (!on) {
    for (const l of rvLayers.values()) l.remove();
    rvLayers.clear();
    $("rvBar").hidden = true;
    return;
  }
  try {
    await loadRadarFrames();
    if (!RV.frames.length) throw new Error("no frames");
    $("rvBar").hidden = false;
    rvShow(RV.frames.length - 1);         // latest frame
    rvRefresh = setInterval(async () => { const playing = !!rvTimer; await loadRadarFrames(); if (!playing) rvShow(RV.frames.length - 1); }, 10 * 60 * 1000);
  } catch (e) {
    $("rvBar").hidden = true;
    toast(T().rvErr, true);
  }
}

  SNAP.reports.forEach((r, i) => {

    const [la, ln] = r.kind === "point" ? r.geom : midOf(r.geom);

    m.show(); snapLayers.push(m); snapMarkers["rp" + i] = m;
  });
  SNAP.roads.forEach((r, i) => {
    const col = SNAP_COL[r.level];
    r.lines.forEach(l => snapLayers.push(map.line(l, { color: col, weight: 7, z: 8 })));

const rt = { from: null, to: null, veh: "car", pins: {}, line: null };

function setRoutePoint(which, ll, label) {

// Place search with suggestions
function wireSearch(inputId, boxId, which) {
  const input = $(inputId), box = $(boxId);
  let timer = null, seq = 0;
  input.addEventListener("input", () => {
    rt[which] = null;
    clearTimeout(timer);
    const q = input.value.trim();
    if (q.length < 2) { box.hidden = true; return; }
    timer = setTimeout(async () => {
      const my = ++seq;
      try {
        const center = rt.from || { lat: 13.76, lng: 100.55 };
        const r = await fetch(`/api/geocode?q=${encodeURIComponent(q)}&lat=${center.lat}&lng=${center.lng}`);
        const j = await r.json();
        if (my !== seq) return;
        if (!r.ok) throw new Error(j.error || r.status);
        box.innerHTML = j.places.length
          ? j.places.map((p, i) => `<button type="button" data-i="${i}">${esc(p.label)}</button>`).join("")
          : `<div class="none">${T().rtNoPlace}</div>`;
        box.onclick = e => {
          const b = e.target.closest("[data-i]"); if (!b) return;
          const p = j.places[+b.dataset.i];
          setRoutePoint(which, p, p.label);
          box.hidden = true;
          map.flyTo([p.lat, p.lng], 14);
        };
        box.hidden = false;
      } catch (err) {
        box.innerHTML = `<div class="none">${esc(err.message)}</div>`;
        box.hidden = false;
      }
    }, 350);
  });
  input.addEventListener("keydown", e => { if (e.key === "Escape") box.hidden = true; });
  document.addEventListener("click", e => { if (!box.contains(e.target) && e.target !== input) box.hidden = true; });
}

// Map button: bring the planner into view and put the cursor where the visitor starts typing
function openPlanner() {
  if (picking) endReport();
  const sec = $("routeSec"), panel = document.querySelector("aside");
  // The side panel is the scrolling element in both layouts; scroll it directly
  // (scrollIntoView's smooth scroll gets cancelled by the focus() below in Chrome).
  const top = panel.scrollTop + sec.getBoundingClientRect().top - panel.getBoundingClientRect().top;
  const smooth = !matchMedia("(prefers-reduced-motion: reduce)").matches;
  panel.scrollTo({ top, behavior: smooth ? "smooth" : "auto" });
  sec.classList.remove("flash"); void sec.offsetWidth; sec.classList.add("flash");
  setTimeout(() => {
    // If smooth scrolling didn't happen (some browsers/webviews skip it), jump there
    if (Math.abs(panel.scrollTop - Math.min(top, panel.scrollHeight - panel.clientHeight)) > 4) panel.scrollTop = top;
    $(rt.from ? "rtTo" : "rtFrom").focus({ preventScroll: true });
  }, smooth ? 700 : 0);
}

function clearRoute() {
  if (rt.line) { rt.line.remove(); rt.line = null; }
  $("rtResult").hidden = true;
  $("rtErr").hidden = true;
}
function resetRoute() {
  clearRoute();
  ["from", "to"].forEach(w => { if (rt.pins[w]) rt.pins[w].remove(); rt.pins[w] = null; rt[w] = null; });
  $("rtFrom").value = "";
  $("rtTo").value = "";
}

const fmtKm = m => (m / 1000).toFixed(m < 10000 ? 1 : 0);
const fmtMin = s => { const m = Math.round(s / 60); return m < 60 ? `${m} ${T().min}` : `${Math.floor(m / 60)} ${T().hr} ${m % 60} ${T().min}`; };

async function planRoute() {
  const t = T(), err = $("rtErr");
  err.hidden = true;
  if (!rt.from || !rt.to) { err.textContent = t.rtNeedBoth; err.hidden = false; return; }
  const go = $("rtGo");
  go.disabled = true; go.textContent = t.rtWorking;
  try {
    const r = await fetch("/api/route", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ from: rt.from, to: rt.to, vehicle: rt.veh }) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || r.status);
    clearRoute();
    rt.line = map.line(j.coords, { color: "#1a5fd0", weight: 6 });
    map.flyToBounds(j.coords, { padding: 40 });
    const extra = j.duration - j.plain.duration;
    const hits = j.stillOn, rc = RCOL();
    const serious = hits.filter(h => h.cat >= 2);
    $("rtResult").innerHTML = `
      <div><span class="big">${fmtKm(j.distance)}</span> ${t.km} · ${fmtMin(j.duration)}</div>
      ${j.avoided ? `<div class="rt-ok">✓ ${t.rtAvoided(j.avoided)}${extra > 60 ? ` (${t.rtExtra(fmtMin(extra))})` : ""}</div>` : ""}
      ${!j.avoided && !serious.length ? `<div class="rt-ok">✓ ${t.rtClear}</div>` : ""}
      ${j.note === "partial" ? `<div class="rt-warn">${t.rtPartial}</div>` : ""}
      ${hits.length ? `<div class="rt-warn">${t.rtStill(hits.length)}</div>
        <div class="list">${hits.map(h => `
          <button class="item" type="button" data-lat="${h.lat}" data-lng="${h.lng}">
            <span class="bar" style="background:${rc[h.cat]}"></span>
            <span><span class="nm">${esc(nm(h.title))}</span><br><span class="pv">${t.roadCat[h.cat]}${h.mustPass ? " · " + t.rtNearEnd : ""}</span></span>
            <span class="pct">${h.depth != null ? Math.round(h.depth) + " " + t.cm : ""}</span>
          </button>`).join("")}</div>` : ""}
      <div class="row">
        <a class="btn on" href="${esc(j.google)}" target="_blank" rel="noopener">${t.rtNavigate}</a>
        <button class="btn" type="button" id="rtClear">${t.rtClearBtn}</button>
      </div>
      <p class="hint">${t.rtDisclaimer}</p>`;
    $("rtResult").hidden = false;
  } catch (e) {
    err.textContent = e.message;
    err.hidden = false;
  } finally {
    go.disabled = false; go.textContent = t.rtGo;
  }
}

};
$("rtVeh").onclick = e => {
  const b = e.target.closest("[data-veh]"); if (!b) return;
  rt.veh = b.dataset.veh;
  $("rtVeh").querySelectorAll("[data-veh]").forEach(x => x.classList.toggle("on", x === b));
  if (rt.line) planRoute();
};
$("rtGo").onclick = planRoute;
document.addEventListener("click", e => {
  if (e.target.closest("#rtResult a.btn")) ev("share_gmaps");
  if (e.target.id === "rtClear") return resetRoute();
  const it = e.target.closest("#rtResult .item");
  if (it) map.flyTo([+it.dataset.lat, +it.dataset.lng], 16);
});

// events (panel controls; nothing here touches the map until it is called)
document.getElementById("lang").onclick = () => {
  lang = lang === "en" ? "th" : "en";
  try { localStorage.setItem("tww-lang", lang); } catch {}
  ev("lang_" + lang);
  renderStatic();
  renderDistrictSelect();
  if (roadData) buildRoadMarkers();
  drawSnap(); drawProne();
  map.closePopup();
};
document.getElementById("refresh").onclick = () => { load(); loadRoads(); };
document.getElementById("showRoads").onchange = applyFilter;
$("reportBtn").onclick = startReport;
$("pickCancel").onclick = endReport;
$("rfCancel").onclick = endReport;
$("pickLoc").onclick = () => locate(true);
$("rf").onsubmit = submitReport;
document.getElementById("showRivers").onchange = applyFilter;
$("showTraffic").onchange = e => {
  map.setTraffic(e.target.checked);
  try { localStorage.setItem("tww-traffic", e.target.checked ? "1" : "0"); } catch {}
};
$("baseRow").onclick = e => {
  const b = e.target.closest("[data-base]"); if (!b || b.dataset.base === map.kind) return;
  try { localStorage.setItem("tww-base", b.dataset.base); sessionStorage.removeItem("tww-gfail"); } catch {}
  location.reload();
};
document.getElementById("roadList").onclick = e => {
  const b = e.target.closest(".item"); if (!b) return;
  const m = roadMarkers.find(m => String(m.data.id) === b.dataset.road); if (!m) return;
  const ll = m.getLatLng();
  map.flyTo([ll.lat, ll.lng], 15, () => m.open());
};
document.getElementById("places").onclick = e => {
  const p = PLACES.find(x => x.key === e.target.dataset.place); if (!p) return;
  document.getElementById("province").value = "";
  if (selDistrict) chooseDistrict("");
  applyFilter();
  p.b ? map.flyToBounds(p.b) : map.flyTo(p.c, p.z);
};
document.getElementById("province").onchange = e => {
  if (selDistrict) chooseDistrict("");
  applyFilter();
  const pts = data.stations.filter(s => s.provinceCode === e.target.value).map(s => [s.lat, s.lng]);
  pts.length ? map.flyToBounds(pts, { padding: 40, maxZoom: 11 }) : map.flyToBounds(PLACES[0].b);
};
document.getElementById("district").onchange = e => chooseDistrict(e.target.value);
document.getElementById("legend").onchange = e => {
  const lv = +e.target.dataset.lv; e.target.checked ? shown.add(lv) : shown.delete(lv); applyFilter();
};
document.getElementById("list").onclick = e => {
  const b = e.target.closest(".item"); if (!b) return;
  const m = markers.find(m => String(m.data.id) === b.dataset.id); if (!m) return;
  const ll = m.getLatLng();
  map.flyTo([ll.lat, ll.lng], 12, () => m.open());
};

async function boot() {
  renderStatic();
  const wantGoogle = CONFIG.googleKey && basePref !== "osm";
  let gfailed = false;
  try { gfailed = sessionStorage.getItem("tww-gfail") === "1"; } catch {}
  map = await createMap($("map"), {
    center: PLACES[1].c, zoom: PLACES[1].z, dark, language: lang,
    googleKey: wantGoogle ? CONFIG.googleKey : null,
  });
  if (wantGoogle && map.kind !== "google") toast(T().gFallback, true);

  // Base-map switch appears only when a Google key is configured
  $("baseRow").hidden = !CONFIG.googleKey;
  $("baseRow").querySelectorAll("[data-base]").forEach(b => b.classList.toggle("on", b.dataset.base === map.kind));
  if (map.kind === "google") {
    $("trafficRow").hidden = false;
    let traffic = true;
    try { traffic = localStorage.getItem("tww-traffic") !== "0"; } catch {}
    $("showTraffic").checked = traffic;
    map.setTraffic(traffic);
  }

  // Buttons on the map (top right): route planner (when enabled) and "Near me"
  const ctl = document.createElement("div");
  ctl.className = "map-ctl";
  if (CONFIG.routing) {
    const rb = document.createElement("button");
    rb.type = "button"; rb.id = "routeBtn"; rb.className = "btn map-btn route-btn"; rb.textContent = T().routeBtn;
    rb.onclick = e => { e.stopPropagation(); openPlanner(); };
    ctl.appendChild(rb);
  }
  const near = document.createElement("button");
  near.type = "button"; near.id = "near"; near.className = "btn map-btn"; near.textContent = T().myLoc;
  near.onclick = e => { e.stopPropagation(); locate(false); };
  ctl.appendChild(near);
  // Optional layers that start switched off: quick on/off buttons, kept in sync with the panel checkboxes
  for (const o of OPTIONAL_LAYERS) {
    const b = document.createElement("button");
    b.type = "button"; b.id = o.btn; b.className = "btn map-btn tgl";
    b.onclick = e => { e.stopPropagation(); const cb = $(o.cb); cb.checked = !cb.checked; cb.dispatchEvent(new Event("change")); };
    ctl.appendChild(b);
    $(o.cb).addEventListener("change", () => onOptionalLayer(o, true));
  }
  restoreOptionalLayers();
  // Overlay on the map area ourselves rather than via the map engine's control system,
  // so the buttons look and behave the same on Google Maps and OpenStreetMap.
  $("map").after(ctl);

  map.on("click", ll => { if (routePick) finishRoutePick(ll); else if (picking) placePick(ll); });
  $("routeSec").hidden = !CONFIG.routing;
  map.on("moveend", updateView);
  // shrink road depth labels to plain squares when zoomed out
  const setFar = () => { $("map").classList.toggle("far", map.getZoom() < 11); $("map").classList.toggle("mid", map.getZoom() < 13); };
  map.on("zoomend", setFar); setFar();
  // re-apply the radar's zoom-based transparency to the frame on screen
  map.on("zoomend", () => { if (RV && rvLayers.size && !$("rvBar").hidden) rvLayer(RV.frames[rvIdx]).setOpacity(rvOpacity()); });

  renderStatic();
  load();
  loadRoads();
  loadDistricts();
  loadSnapshot();
  loadCams();
  loadGov();
  renderSources();
  setRadarOverlay($("showRadarOverlay").checked);
  setInterval(loadGov, 10 * 60 * 1000);
  setInterval(() => { load(); loadRoads(); }, 5 * 60 * 1000);
}
boot();
</script>
</body>
</html>
